name: Déploiement

# Déploie l'application à chaque push sur main (après la CI) :
#   1. règles + index Firestore et Cloud Functions, avec le compte limité « github-deployer » ;
#   2. le site sur App Hosting, avec le compte Terraform : le CLI Firebase recrée à chaque
#      déploiement le compte « firebase-app-hosting-compute » et met à jour les droits du projet,
#      ce qui exige un niveau propriétaire que le compte limité n'a volontairement pas.
on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      target:
        description: "Que déployer ?"
        type: choice
        options: [tout, backend, site]
        default: tout

permissions:
  contents: read
  id-token: write # OIDC → Workload Identity Federation (aucune clé stockée)

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FIREBASE_TOOLS_VERSION: "14"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: firebase deploy
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Dépendances des fonctions
        run: npm ci
        working-directory: functions

      # --- 1. Firestore + fonctions (compte limité) ---
      - name: Authentification Google Cloud (github-deployer)
        if: inputs.target != 'site'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Déployer règles Firestore et fonctions
        if: inputs.target != 'site'
        run: |
          npx --yes firebase-tools@${FIREBASE_TOOLS_VERSION} deploy \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --only "firestore,functions" \
            --non-interactive --force

      # --- 2. Site App Hosting (compte Terraform) ---
      - name: Authentification Google Cloud (github-terraform)
        if: inputs.target != 'backend'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}

      - name: Déployer le site (App Hosting)
        if: inputs.target != 'backend'
        run: |
          npx --yes firebase-tools@${FIREBASE_TOOLS_VERSION} deploy \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --only "apphosting" \
            --non-interactive --force
